      <stop offset="0.76" stop-color="#e6dfd0"/>
      <stop offset="1" stop-color="#cdc4ac"/>
    </linearGradient>
    <linearGradient id="wingG" x1="0.1" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#f3eddf"/>
      <stop offset="0.55" stop-color="#e1d9c6"/>
      <stop offset="1" stop-color="#c7bda3"/>
