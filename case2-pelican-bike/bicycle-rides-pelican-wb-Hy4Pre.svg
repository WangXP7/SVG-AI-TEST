<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
  <title>自行车骑鹈鹕</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
