    <linearGradient id="pouchG" x1="0.15" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#fdc970"/>
      <stop offset="0.5" stop-color="#ea9a33"/>
      <stop offset="1" stop-color="#c2651a"/>
    </linearGradient>
    <radialGradient id="sunG">
