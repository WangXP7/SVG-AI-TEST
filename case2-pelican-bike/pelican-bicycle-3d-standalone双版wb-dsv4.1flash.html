<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>鹈鹕骑自行车 3D · 正常版</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#128690;</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0e1420}
body{
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:#f2f7fb;
}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}

/* 像素版：低分辨率缓冲 + 最近邻放大 */
body.pixel #stage canvas{image-rendering:pixelated;image-rendering:crisp-edges}

#hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s ease}
#hud.ready{opacity:1}

.title{
  position:absolute;left:26px;top:22px;
  text-shadow:0 2px 14px rgba(6,26,45,.55);
}
.title h1{
  font-size:19px;font-weight:600;letter-spacing:.30em;line-height:1.5;
}
.title p{
  margin-top:6px;font-size:12.5px;letter-spacing:.10em;
  color:rgba(255,255,255,.82);text-shadow:0 1px 8px rgba(6,26,45,.6);
}

.bar{
  position:absolute;right:22px;top:20px;display:flex;gap:9px;pointer-events:auto;
}
.bar a,.bar button{
  font:inherit;font-size:12.5px;letter-spacing:.08em;
  padding:8px 15px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(255,255,255,.34);
  background:rgba(10,30,52,.30);
  -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
  color:#fff;text-decoration:none;transition:background .18s,border-color .18s;
}
.bar a:hover,.bar button:hover{background:rgba(10,30,52,.52);border-color:rgba(255,255,255,.6)}
.bar a.cur{background:rgba(255,255,255,.92);color:#123a55;border-color:transparent;font-weight:600}
.bar button.on{background:rgba(255,231,160,.9);color:#4a3410;border-color:transparent;font-weight:600}

.hint{
  position:absolute;left:26px;bottom:20px;
  font-size:12px;letter-spacing:.10em;color:rgba(255,255,255,.78);
  text-shadow:0 1px 8px rgba(6,26,45,.65);
}
.tag{
  position:absolute;right:22px;bottom:20px;
  font-size:11.5px;letter-spacing:.16em;color:rgba(255,255,255,.72);
  text-shadow:0 1px 8px rgba(6,26,45,.65);
}
body.pixel .tag{font-family:ui-monospace,Consolas,"Courier New",monospace}

/* 像素版 HUD 改成方块感 */
body.pixel .bar a,body.pixel .bar button{border-radius:3px;font-family:ui-monospace,Consolas,monospace;letter-spacing:.06em}
body.pixel .title h1,body.pixel .title p,body.pixel .hint{font-family:ui-monospace,Consolas,monospace}

#err{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  max-width:560px;padding:22px 26px;border-radius:12px;
  background:rgba(24,10,14,.92);border:1px solid rgba(255,120,120,.4);
  font-size:13px;line-height:1.7;display:none;
}
#err.show{display:block}
</style>
</head>
<body>
  <div id="stage"></div>

  <div id="hud">
    <div class="title">
      <h1>PELICAN ON A BICYCLE</h1>
      <p id="subtitle">鹈鹕骑自行车 · 正常版 3D</p>
    </div>
    <div class="bar">
      <button data-mode="smooth" class="cur" type="button">正常版</button>
      <button data-mode="voxel" type="button">像素版</button>
      <button id="btn-rotate" type="button">自动旋转</button>
    </div>
    <div class="hint">拖拽旋转 · 滚轮缩放 · 右键平移</div>
    <div class="tag" id="tag">平滑几何 · ACES 色调映射 · 阴影贴图 2048</div>
  </div>

  <div id="err"></div>
