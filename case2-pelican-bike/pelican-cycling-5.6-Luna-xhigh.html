<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鹈鹕骑自行车</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #102b3e;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
    }
    .scene {
      width: min(100vw, 1100px);
      aspect-ratio: 16 / 10;
      overflow: hidden;
      border-radius: 22px;
      box-shadow: 0 24px 70px #07141fcc;
      background: #8bd6e7;
    }
    svg { display: block; width: 100%; height: 100%; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: roll 3.2s linear infinite; }
    .pelican { transform-box: fill-box; transform-origin: center bottom; animation: bob .7s ease-in-out infinite alternate; }
    .wave { animation: drift 4s ease-in-out infinite alternate; }
    .wave.delay { animation-delay: -2s; }
    @keyframes roll { to { transform: rotate(360deg); } }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }
    @keyframes drift { from { transform: translateX(-12px); } to { transform: translateX(12px); } }
    @media (prefers-reduced-motion: reduce) { .wheel, .pelican, .wave { animation: none; } }
  </style>
</head>
<body>
  <main class="scene" aria-label="一只鹈鹕骑着自行车经过海滨">
    <svg viewBox="0 0 1100 688" role="img" aria-labelledby="title desc">
      <title id="title">鹈鹕骑自行车</title>
      <desc id="desc">阳光明媚的海滨步道上，一只白色鹈鹕骑着蓝色自行车。</desc>
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#80d8ef"/><stop offset="1" stop-color="#f9d99b"/></linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2aabc2"/><stop offset="1" stop-color="#126a91"/></linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7d99b"/><stop offset="1" stop-color="#d79e68"/></linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="9"/></filter>
      </defs>

      <rect width="1100" height="688" fill="url(#sky)"/>
      <circle cx="900" cy="118" r="60" fill="#ffe98e" opacity=".92"/>
      <g fill="#fff" opacity=".7">
        <path d="M150 147c-25 0-43-14-43-32 0-20 20-35 45-35 10-22 33-36 60-36 35 0 64 22 70 51 21 2 37 15 37 32 0 19-20 34-45 34z"/>
        <path d="M720 198c-18 0-32-10-32-24 0-15 15-27 34-27 8-18 25-28 45-28 26 0 48 17 52 39 17 2 28 12 28 25 0 14-15 25-34 25z"/>
      </g>

      <path d="M0 304 Q180 268 350 309 T700 299 T1100 309 V488 H0Z" fill="url(#sea)"/>
      <g class="wave" fill="none" stroke="#bceef0" stroke-width="6" stroke-linecap="round" opacity=".75">
        <path d="M52 360c52-23 105 23 157 0s105 23 157 0"/>
        <path d="M736 360c52-23 105 23 157 0s105 23 157 0"/>
      </g>
      <g class="wave delay" fill="none" stroke="#72d1dc" stroke-width="5" stroke-linecap="round" opacity=".8">
        <path d="M350 415c45-18 90 18 135 0s90 18 135 0"/>
        <path d="M840 437c34-14 68 14 102 0s68 14 102 0"/>
      </g>

      <path d="M0 455 Q250 414 495 454 T1100 450 V688 H0Z" fill="url(#road)"/>
      <path d="M0 474 Q270 431 500 471 T1100 467" fill="none" stroke="#fff1bf" stroke-width="8" opacity=".7"/>
      <g fill="#fff1bd" opacity=".8"><path d="M50 585h130l-20 12H30z"/><path d="M300 560h130l-20 12H280z"/><path d="M790 592h130l-20 12H770z"/></g>

      <ellipse cx="566" cy="585" rx="245" ry="24" fill="#704d4a" opacity=".25" filter="url(#shadow)"/>

      <!-- bicycle -->
      <g stroke="#173f5b" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g class="wheel"><circle cx="390" cy="550" r="78" stroke="#f5f4dd" stroke-width="10"/><circle cx="390" cy="550" r="7" fill="#173f5b"/><path d="M390 478v144M318 550h144M339 499l102 102M441 499L339 601" stroke-width="3" opacity=".65"/></g>
        <g class="wheel"><circle cx="747" cy="550" r="78" stroke="#f5f4dd" stroke-width="10"/><circle cx="747" cy="550" r="7" fill="#173f5b"/><path d="M747 478v144M675 550h144M696 499l102 102M798 499L696 601" stroke-width="3" opacity=".65"/></g>
        <path d="M390 550l115-102 84 102H390l72-3"/>
        <path d="M505 448l62-80M568 368h56M506 448l-25-22"/>
        <path d="M589 550l66-126 92 126M655 424l-19-20h35"/>
        <path d="M491 447h33M555 550l-23 24M566 550l24 23" stroke-width="6"/>
      </g>
      <path d="M610 364h36" stroke="#e55d55" stroke-width="10" stroke-linecap="round"/>

      <!-- pelican -->
      <g class="pelican">
        <path d="M466 371c-8-64 29-119 96-122 53-3 88 30 93 75 5 43-20 74-58 88-42 15-95 5-131-41z" fill="#fffdf2" stroke="#173f5b" stroke-width="8"/>
        <path d="M524 250c-7-48 8-82 42-101 25-14 52-6 62 18 8 21-4 48-30 66-22 15-45 21-74 17z" fill="#fffdf2" stroke="#173f5b" stroke-width="8"/>
        <path d="M571 228c20-8 39-5 53 5" fill="none" stroke="#d8b56e" stroke-width="6" stroke-linecap="round"/>
        <path d="M620 225c37-3 78 7 126 29-47 24-91 30-130 17z" fill="#f2ad68" stroke="#173f5b" stroke-width="8"/>
        <circle cx="592" cy="178" r="8" fill="#173f5b"/><circle cx="595" cy="175" r="3" fill="#fff"/>
        <path d="M540 292c45 24 69 52 84 93-38 23-80 20-114-5 5-35 13-60 30-88z" fill="#dceaf0" stroke="#173f5b" stroke-width="8"/>
        <path d="M512 375c24 35 48 61 82 87l-44 15c-31-20-53-48-63-79z" fill="#f7c47a" stroke="#173f5b" stroke-width="8"/>
        <path d="M488 410l-14 45M574 456l-11 39" stroke="#e6a05b" stroke-width="10" stroke-linecap="round"/>
        <path d="M461 494c18-10 38-10 56 0M546 495c18-10 37-10 55 0" fill="none" stroke="#173f5b" stroke-width="7" stroke-linecap="round"/>
        <!-- wing reaching the handlebar -->
        <path d="M624 302c-37 17-62 45-75 82l23 13c25-19 48-45 67-76z" fill="#eef8f8" stroke="#173f5b" stroke-width="8"/>
      </g>

      <g fill="#173f5b" opacity=".8" font-family="Microsoft YaHei, sans-serif">
        <text x="55" y="80" font-size="28" font-weight="700">海风骑行日</text>
        <text x="57" y="109" font-size="15" opacity=".8">Pelican on the promenade</text>
      </g>
    </svg>
  </main>
</body>
</html>
