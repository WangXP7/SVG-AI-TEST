<html lang="zh-CN" data-style="classic">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="鹈鹕骑车双版本离线动画：普通 3D 与像素风 3D，内置全部运行代码，双击即可使用。">

  <style>
    :root {
      color-scheme: light; --bg: #faf6eb; --ink: #29483f; --muted: #647566;
      --accent: #346d5d; --paper: #fffdf5; --line: #d9dfcf; --active: #e6eddc;
      --radius: 16px; --shadow: 0 10px 40px #29483f14;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: var(--bg); color: var(--ink); }
    button, input { font: inherit; }
    button { cursor: pointer; color: inherit; }
    button:disabled, input:disabled { opacity: .55; cursor: wait; }
    button:focus-visible, input:focus-visible { outline: 3px solid #d5a744; outline-offset: 4px; }
    button { -webkit-tap-highlight-color: transparent; }
    .page { position: relative; width: 100%; height: 100vh; height: 100svh; min-height: 660px; overflow: hidden; }
    #scene { position: absolute; inset: 0; margin: 0; touch-action: none; }
    #scene canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    #scene canvas:active { cursor: grabbing; }
    .header { position: absolute; top: 29px; left: 37px; right: 37px; z-index: 3; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; pointer-events: none; }
    .brand { display: flex; gap: 12px; align-items: center; min-width: 0; }
    .brand-icon { display: grid; place-items: center; width: 46px; height: 46px; border: 1px solid #bfcdbd; border-radius: 50%; flex-shrink: 0; }
    .brand-icon svg { width: 26px; height: 26px; }
    h1 { margin: 0 0 5px; font-size: 20px; letter-spacing: .10em; font-weight: 650; }
    #subtitle { margin: 0; font-size: 11px; letter-spacing: .10em; color: var(--muted); }
    .mode-switch { pointer-events: auto; display: flex; gap: 4px; padding: 5px; background: #fffdf5e8; border: 1px solid var(--line); border-radius: 30px; box-shadow: 0 3px 12px #304b3806; }
    .mode-switch button { border: 0; background: transparent; border-radius: 24px; padding: 10px 20px; min-height: 41px; font-size: 14px; color: var(--muted); white-space: nowrap; }
    .mode-switch button[aria-pressed="true"] { background: var(--accent); color: #fffdf5; }
    .offline { justify-self: end; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .offline-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; }
    .note { position: absolute; left: 5%; top: 22%; pointer-events: none; }
    #eyebrow { font-size: 11px; color: var(--muted); letter-spacing: .13em; }
    #scene-note { margin: 12px 0 20px; font-family: "STSong", "SimSun", serif; font-size: clamp(22px, 2.2vw, 32px); font-weight: 400; letter-spacing: .09em; }
    .note-line { display: block; width: 36px; height: 2px; background: #d4a363; }
    .footer { position: absolute; z-index: 3; left: 50%; bottom: 23px; width: min(830px, calc(100% - 40px)); transform: translateX(-50%); }
    .hint { text-align: center; font-size: 12px; color: var(--muted); margin: 0 0 15px; letter-spacing: .04em; }
    .controls { display: flex; align-items: center; gap: 22px; padding: 17px 22px; border: 1px solid #fffdf9; background: #fffdf5f2; border-radius: 22px; box-shadow: var(--shadow); }
    .controls button { min-height: 39px; font-size: 14px; border-radius: 10px; border: 0; }
    #play { background: var(--accent); color: #fffdf5; min-width: 108px; min-height: 44px; padding: 0 17px; display: flex; align-items: center; justify-content: center; gap: 9px; }
    #play-icon { display: inline-block; width: 17px; font-size: 16px; line-height: 1; }
    .divider { width: 1px; height: 31px; background: var(--line); flex-shrink: 0; }
    .speed-control { flex: 1; min-width: 132px; }
    .speed-heading { display: flex; justify-content: space-between; gap: 10px; align-items: center; font-size: 14px; margin-bottom: 8px; }
    #speed-value { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    #speed { --fill: 42.857%; appearance: none; -webkit-appearance: none; display: block; width: 100%; height: 18px; margin: 0; background: transparent; cursor: pointer; }
    #speed::-webkit-slider-runnable-track { height: 5px; border-radius: 5px; background: linear-gradient(to right, var(--accent) var(--fill), var(--line) var(--fill)); }
    #speed::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%; margin-top: -5px; background: var(--accent); border: 3px solid var(--paper); box-shadow: 0 0 0 1px #9ab398; }
    #speed::-moz-range-track { height: 5px; background: var(--line); border-radius: 5px; }
    #speed::-moz-range-progress { height: 5px; background: var(--accent); }
    #speed::-moz-range-thumb { width: 10px; height: 10px; background: var(--accent); border: 3px solid var(--paper); box-shadow: 0 0 0 1px #9ab398; border-radius: 50%; }
    .view-switch { display: flex; gap: 3px; }
    .view-switch button { background: transparent; padding: 0 12px; white-space: nowrap; color: var(--muted); }
    .view-switch button[aria-pressed="true"] { background: var(--active); color: var(--ink); }
    #reset { display: grid; place-items: center; width: 38px; flex-shrink: 0; background: transparent; color: var(--muted); }
    #reset svg { width: 19px; height: 19px; }
    #caption { text-align: center; margin: 17px 0 0; font-size: 12px; letter-spacing: .05em; color: var(--muted); }
    #scene-message { position: absolute; z-index: 4; left: 50%; top: 43%; transform: translate(-50%, -50%); background: var(--paper); border: 1px solid var(--line); padding: 18px 24px; border-radius: var(--radius); box-shadow: var(--shadow); width: max-content; max-width: min(430px, 90%); text-align: center; font-size: 14px; line-height: 1.8; }
    #message-text { margin: 0; }
    #retry { margin-top: 12px; border: 0; padding: 9px 18px; border-radius: 8px; background: var(--accent); color: #fffdf5; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    noscript { position: absolute; top: 35%; left: 10%; width: 80%; padding: 25px; background: #fff; text-align: center; z-index: 5; }

    /* 同一个界面在像素版中使用直角边框和硬阴影。 */
    html[data-style="pixel"] { --bg: #c2e4e8; --ink: #243847; --muted: #41646c; --accent: #267e71; --paper: #fff5dc; --line: #bac9bd; --active: #f3d891; --radius: 0px; --shadow: 5px 5px 0 #243847; font-family: Consolas, "Lucida Console", "Microsoft YaHei", monospace; }
    [data-style="pixel"] .page { border: 7px solid var(--ink); }
    [data-style="pixel"] .brand-icon { border: 2px solid var(--ink); border-radius: 0; background: var(--paper); box-shadow: 3px 3px 0 var(--ink); }
    [data-style="pixel"] h1 { font-weight: 800; }
    [data-style="pixel"] .mode-switch { border-radius: 0; border: 2px solid var(--ink); background: var(--paper); box-shadow: 4px 4px 0 var(--ink); }
    [data-style="pixel"] .mode-switch button { border-radius: 0; }
    [data-style="pixel"] .offline-dot { border-radius: 0; }
    [data-style="pixel"] #scene-note { font-family: inherit; font-weight: bold; text-shadow: 2px 2px 0 #eef6df; letter-spacing: .02em; }
    [data-style="pixel"] .note-line { height: 5px; background: #ef9862; box-shadow: 6px 4px 0 #f7d986; }
    [data-style="pixel"] .controls { border: 3px solid var(--ink); border-radius: 0; background: var(--paper); }
    [data-style="pixel"] .controls button { border-radius: 0; }
    [data-style="pixel"] #play { border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
    [data-style="pixel"] .view-switch button[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: -2px; }
    [data-style="pixel"] #speed::-webkit-slider-thumb { border-radius: 0; border: 2px solid var(--ink); background: #efaf55; width: 15px; height: 19px; margin-top: -7px; box-shadow: 2px 2px 0 var(--ink); }
    [data-style="pixel"] #speed::-moz-range-thumb { border-radius: 0; border: 2px solid var(--ink); background: #efaf55; box-shadow: 2px 2px 0 var(--ink); }
    [data-style="pixel"] #scene-message { border: 2px solid var(--ink); }
    @media (max-width: 1050px) {
      .header { left: 26px; right: 26px; gap: 12px; }
      .offline { font-size: 11px; } .mode-switch button { padding: 10px 14px; }
      #subtitle { font-size: 10px; letter-spacing: .04em; } .controls { gap: 16px; }
      .note { top: 19%; }
    }
    @media (max-width: 720px) {
      .page { min-height: 780px; } .header { top: 21px; left: 22px; right: 22px; grid-template-columns: 1fr auto; gap: 17px; }
      .mode-switch { grid-row: 2; grid-column: 1 / -1; justify-self: center; }
      .mode-switch button { min-width: 124px; } .offline { font-size: 11px; }
      h1 { font-size: 18px; } .brand-icon { width: 39px; height: 39px; }
      .note { top: 22%; left: 6%; } #scene-note { font-size: 22px; } #eyebrow { font-size: 10px; }
      .footer { width: calc(100% - 36px); bottom: 21px; }
      .controls { flex-wrap: wrap; padding: 15px; gap: 14px; border-radius: 17px; }
      .divider { display: none; } .speed-control { flex: 1; min-width: 125px; }
      .view-switch { flex: 1; justify-content: center; } .view-switch button { padding: 0 17px; }
      #reset { margin-right: 10px; } #caption { margin-top: 17px; font-size: 11px; }
      .hint { font-size: 11px; margin-bottom: 12px; }
      [data-style="pixel"] .page { border-width: 5px; }
    }
    @media (max-width: 380px) {
      .header { left: 14px; right: 14px; } .brand { gap: 8px; } .offline { font-size: 10px; gap: 5px; }
      .controls { padding: 13px; gap: 11px; } .view-switch button { padding: 0 12px; }
      #play { min-width: 96px; padding: 0 13px; } .speed-control { min-width: 110px; }
    }

<body>
  <main class="page">
    <header class="header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="23" r="6"/><circle cx="25" cy="23" r="6"/><path d="M8 23l6-13 6 13H8l15-13 2 13M10 10h8M21 6h4l2 5"/></svg></span>
        <div><h1 id="title">海风骑行</h1><p id="subtitle">PELICAN COASTAL RIDE</p></div>
      </div>
      <div class="mode-switch" role="group" aria-label="切换动画版本">
        <button type="button" data-mode="classic" aria-pressed="true" aria-controls="scene">普通 3D</button>
        <button type="button" data-mode="pixel" aria-pressed="false" aria-controls="scene">像素风 3D</button>
      </div>
      <span class="offline"><span class="offline-dot" aria-hidden="true"></span>离线珍藏版</span>
    </header>
    <figure id="scene" aria-label="鹈鹕骑车三维动画"></figure>
    <aside class="note" aria-hidden="true"><span id="eyebrow">A LITTLE COASTAL ESCAPE</span><p id="scene-note">今天，慢一点。</p><span class="note-line"></span></aside>
    <div id="scene-message"><p id="message-text">正在迎接海风…</p><button id="retry" type="button" hidden>重新加载</button></div>
    <output id="live-status" class="sr-only" aria-live="polite" aria-atomic="true"></output>
    <footer class="footer">
      <p class="hint">拖动环绕 · 滚轮 / 双指缩放 · 空格暂停</p>
      <div class="controls" role="group" aria-label="动画控制">
        <button id="play" type="button" aria-label="暂停动画" disabled><span id="play-icon" aria-hidden="true">Ⅱ</span><span id="play-label">暂停</span></button>
        <span class="divider" aria-hidden="true"></span>
        <div class="speed-control"><div class="speed-heading"><label for="speed">骑行速度</label><output id="speed-value" for="speed">1.0×</output></div><input id="speed" type="range" min="0.25" max="2" step="0.25" value="1" disabled></div>
        <span class="divider" aria-hidden="true"></span>
        <div class="view-switch" role="group" aria-label="选择视角">
          <button type="button" data-view="postcard" id="view-postcard" aria-pressed="true" disabled>明信片</button>
          <button type="button" data-view="side" aria-pressed="false" disabled>侧面</button>
          <button type="button" data-view="front" aria-pressed="false" disabled>迎风</button>
        </div>
        <button id="reset" type="button" aria-label="恢复默认视角和速度" title="恢复默认视角和速度" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11a9 9 0 1 1 3 7M3 4v7h7"/></svg></button>
      </div>
      <p id="caption">一只鹈鹕，一段不赶时间的旅程。</p>
    </footer>
    <noscript>请启用浏览器的 JavaScript 后重新打开此文件。此动画可完全离线运行。</noscript>
  </main>
